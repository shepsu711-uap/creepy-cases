<!doctype html>
<!--
  ============================================================
  HOW TO EDIT THE CAROUSEL  (product-2.html)
  ============================================================
  ADD A PHOTO      Copy one <li class="slide">…</li> line, paste it where you want it, change the file name.
  REMOVE A PHOTO   Delete its <li class="slide">…</li> line.
  REORDER          Cut a line and paste it somewhere else. The FIRST one is what people see first.
  FILES            Put photos in assets/photos/. Best shape is 4:5 (tall), about 1200 x 1500.
  COUNTER "1 / 7" Updates by itself. No numbers to change.
  NAME / PRICE     Change the <h1> and the <p class="price"> under the photos.
  NAME           "Third Eye Possessed" is only a PLACEHOLDER name. Change it in 3 spots: <title> (top of page), the <h1> below the photos,
                 and the <h3> of this product's tile in index.html. Price is still the placeholder [$ price].
  SHOP TILE PHOTO  The picture on the shop page is set in index.html (the Third Eye Possessed <li class="card">).
  THIS PAGE      product-2.html = the second product. Jogo's page is product.html. For a third product, copy this file.
  ============================================================
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Third Eye Possessed — Creepy Cases by WAR</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rock+Salt&family=Space+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="Creepy Cases — home">Creepy Cases</a>
  </header>

  <a class="back" href="index.html#shop">← Shop</a>

  <main class="product">
    <div class="carousel" id="carousel">
      <!-- swipe left / right. One <li> per photo. -->
      <ul class="slides" id="slides" aria-label="Third Eye Possessed photos">
        <li class="slide"><img src="assets/photos/p2-face-black.jpg" alt="Third Eye Possessed, clean studio photo of the clay lighter case with a sculpted grinning face and three eyes, on black" width="1200" height="1500"></li>
        <li class="slide"><img src="assets/photos/p2-face-pattern.jpg" alt="Third Eye Possessed face side on a pattern of the words Creepy Cases, left half lit, right half in shadow" width="1200" height="1500" loading="lazy"></li>
        <li class="slide"><img src="assets/photos/p2-star-black.jpg" alt="Back of the case: a cream star with an eye in the center and four teardrop spikes on pink clay, on black" width="1200" height="1500" loading="lazy"></li>
        <li class="slide"><img src="assets/photos/p2-star-pattern.jpg" alt="Back of the case on a pattern of the words Creepy Cases, left half lit, right half in shadow" width="1200" height="1500" loading="lazy"></li>
        <li class="slide"><img src="assets/photos/p2-face-white.jpg" alt="Third Eye Possessed face side on a white background" width="1200" height="1500" loading="lazy"></li>
        <li class="slide"><img src="assets/photos/p2-face-hand.jpg" alt="Third Eye Possessed face side with a lighter inside, held in a hand" width="1200" height="1500" loading="lazy"></li>
        <li class="slide"><img src="assets/photos/p2-star-hand.jpg" alt="Third Eye Possessed star-eye back with a lighter inside, held in a hand" width="1200" height="1500" loading="lazy"></li>
      </ul>
      <button class="arrow prev" type="button" aria-label="Previous photo">‹</button>
      <button class="arrow next" type="button" aria-label="Next photo">›</button>
      <span class="count" id="count" aria-live="polite">1 / 1</span>
    </div>

    <div class="product-info">
      <h1>Third Eye Possessed</h1>   <!-- PLACEHOLDER name, see HOW TO EDIT at the top -->
      <p class="price">[$ price]</p>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 WAR</p>
    <p><a href="policies.html">Shipping &amp; Policies</a> · <a href="https://www.tiktok.com/@rain.art.warr" target="_blank" rel="noopener noreferrer">TikTok @rain.art.warr</a></p>
  </footer>

  <!-- tiny script: arrows + "1 / 10" counter. The carousel still swipes without it. -->
  <script>
    document.documentElement.classList.add('js');
    var s = document.getElementById('slides'), c = document.getElementById('count');
    var n = s.children.length, i = function () { return Math.round(s.scrollLeft / s.clientWidth); };
    function show() { c.textContent = (i() + 1) + ' / ' + n; }
    function go(d) { s.scrollTo({ left: (i() + d) * s.clientWidth, behavior: 'smooth' }); }
    s.addEventListener('scroll', show); window.addEventListener('resize', show); show();
    document.querySelector('.prev').onclick = function () { go(-1); };
    document.querySelector('.next').onclick = function () { go(1); };
    s.tabIndex = 0;
    s.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); });
  </script>
</body>
</html>
